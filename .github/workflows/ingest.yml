name: Ingest StatsBomb lake to Drive

# Runs the existing scripts/ingest.py on GitHub's runner instead of the
# laptop, pulling/pushing the lake to Google Drive via rclone before and
# after -- the same "data goes to Drive, never the local machine" model
# the Colab notebook uses, just triggered without a browser. Explicit
# copy (not a FUSE mount) so the push step is a plain synchronous
# command rather than relying on unmount to flush cached writes.
#
# Authenticates as the user (OAuth, via `rclone authorize "drive"`), not
# a service account: service accounts have no Drive storage quota of
# their own, so writes into a folder merely *shared* with one (rather
# than a Shared Drive, a Workspace-only feature) fail with
# storageQuotaExceeded. One-time setup: see
# docs/github_actions_drive_setup.md.

on:
  workflow_dispatch:
    inputs:
      only:
        description: "Space-separated competition-season keys (blank = everything not yet ingested)"
        required: false
        default: ""
      workers:
        description: "Concurrent download workers"
        required: false
        default: "8"

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install pitchgraph
        run: pip install -e .

      - name: Install rclone
        run: curl https://rclone.org/install.sh | sudo bash

      - name: Configure rclone
        env:
          GDRIVE_OAUTH_TOKEN: ${{ secrets.GDRIVE_OAUTH_TOKEN }}
          GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
        run: |
          mkdir -p ~/.config/rclone
          cat > ~/.config/rclone/rclone.conf <<EOF
          [gdrive]
          type = drive
          scope = drive
          token = ${GDRIVE_OAUTH_TOKEN}
          root_folder_id = ${GDRIVE_FOLDER_ID}
          EOF

      - name: Pull existing lake from Drive (resume support)
        run: |
          mkdir -p "$HOME/pitchgraph"
          rclone copy gdrive: "$HOME/pitchgraph" --fast-list -v

      - name: Ingest
        env:
          PITCHGRAPH_DATA: /home/runner/pitchgraph
          ONLY: ${{ inputs.only }}
          WORKERS: ${{ inputs.workers }}
        run: |
          python scripts/ingest.py ${ONLY:+--only $ONLY} --workers "$WORKERS"

      - name: Push lake to Drive
        if: always()
        run: |
          rclone copy "$HOME/pitchgraph" gdrive: --fast-list -v
