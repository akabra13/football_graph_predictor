name: Ingest StatsBomb lake to Drive

# Runs the existing scripts/ingest.py on GitHub's runner instead of the
# laptop, pulling/pushing the lake to Google Drive via rclone before and
# after -- the same "data goes to Drive, never the local machine" model
# the Colab notebook uses, just triggered without a browser. Explicit
# copy (not a FUSE mount) so the push step is a plain synchronous
# command rather than relying on unmount to flush cached writes.
#
# Authenticates as the user (OAuth, via `rclone authorize "drive"`), not
# a service account: service accounts have no Drive storage quota of
# their own, so writes into a folder merely *shared* with one (rather
# than a Shared Drive, a Workspace-only feature) fail with
# storageQuotaExceeded. One-time setup: see
# docs/github_actions_drive_setup.md.

on:
  # Weekly: ingest only competition-seasons that StatsBomb added or updated since the last run
  # (scripts/check_source.py). Cheap when nothing changed: only competitions.json and two small
  # files are fetched.
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:
    inputs:
      only:
        description: "Space-separated competition-season keys (blank = everything not yet ingested)"
        required: false
        default: ""
      workers:
        description: "Concurrent download workers"
        required: false
        default: "8"
      force:
        description: "Redownload and overwrite already-done competition-seasons (e.g. after a schema change)"
        type: boolean
        required: false
        default: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install pitchgraph
        run: pip install -e .

      - name: Install rclone
        run: curl https://rclone.org/install.sh | sudo bash

      - name: Configure rclone
        env:
          GDRIVE_OAUTH_TOKEN: ${{ secrets.GDRIVE_OAUTH_TOKEN }}
          GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
        run: |
          mkdir -p ~/.config/rclone
          cat > ~/.config/rclone/rclone.conf <<EOF
          [gdrive]
          type = drive
          scope = drive
          token = ${GDRIVE_OAUTH_TOKEN}
          root_folder_id = ${GDRIVE_FOLDER_ID}
          EOF

      - name: Check StatsBomb for new or updated competition-seasons
        id: check
        env:
          PITCHGRAPH_DATA: /home/runner/pitchgraph
        run: |
          mkdir -p "$HOME/pitchgraph/lake"
          rclone copy gdrive:lake "$HOME/pitchgraph/lake" --include "manifest.json" --include "source_state.json" -v
          KEYS=$(python scripts/check_source.py)
          if [ ! -f "$HOME/pitchgraph/lake/source_state.json" ]; then
            # first run: record the current timestamps so later updates to existing seasons are detected
            python scripts/check_source.py --write-state
            rclone copy "$HOME/pitchgraph/lake/source_state.json" gdrive:lake -v
          fi
          echo "keys=$KEYS" >> "$GITHUB_OUTPUT"
          echo "new or updated: ${KEYS:-none}"

      - name: Pull existing lake from Drive (resume support)
        if: github.event_name == 'workflow_dispatch' || steps.check.outputs.keys != ''
        run: |
          mkdir -p "$HOME/pitchgraph"
          rclone copy gdrive: "$HOME/pitchgraph" --fast-list -v

      - name: Ingest
        if: github.event_name == 'workflow_dispatch' || steps.check.outputs.keys != ''
        env:
          PITCHGRAPH_DATA: /home/runner/pitchgraph
          ONLY: ${{ inputs.only }}
          WORKERS: ${{ inputs.workers || '8' }}
          FORCE: ${{ inputs.force }}
          SCHEDULED_KEYS: ${{ steps.check.outputs.keys }}
          EVENT: ${{ github.event_name }}
        run: |
          FORCE_FLAG=""
          [ "$FORCE" = "true" ] && FORCE_FLAG="--force"
          if [ "$EVENT" = "schedule" ]; then
            # updated seasons must be re-downloaded, so force applies to exactly these keys
            ONLY="$SCHEDULED_KEYS"; FORCE_FLAG="--force"
          fi
          python scripts/ingest.py ${ONLY:+--only $ONLY} --workers "$WORKERS" $FORCE_FLAG
          python scripts/check_source.py --write-state

      - name: Push lake to Drive
        if: always() && (github.event_name == 'workflow_dispatch' || steps.check.outputs.keys != '')
        run: |
          rclone copy "$HOME/pitchgraph" gdrive: --fast-list -v
